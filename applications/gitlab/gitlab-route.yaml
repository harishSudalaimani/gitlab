apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitlab-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "41"

spec:
  project: homelab

  source:
    repoURL: ssh://git@gitlab.com/harishSudalaimani/gitlab.git
    targetRevision: main
    path: manifests/gitlab

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
