apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitlab
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: homelab

  source:
    repoURL: https://charts.gitlab.io/
    chart: gitlab
    targetRevision: 10.2.4

    helm:
      values: |
        # ============================================================
        # GLOBAL
        # ============================================================

        global:
          edition: ce

          hosts:
            domain: harish8.com
            hostSuffix: ""
            https: true

            gitlab:
              name: git.harish8.com

            registry:
              name: registry.harish8.com

          # ==========================================================
          # Gateway API
          #
          # Cilium + Gateway API are already running in the cluster.
          # GitLab must NOT install Envoy Gateway.
          # ==========================================================

          gatewayApi:
            enabled: false
            configureCertmanager: false

          # ==========================================================
          # Ingress
          #
          # We will expose GitLab through our existing Cilium
          # Gateway API infrastructure.
          # ==========================================================

          ingress:
            enabled: false
            configureCertmanager: false

          # ==========================================================
          # KAS
          # ==========================================================

          kas:
            enabled: false

          # ==========================================================
          # PostgreSQL
          #
          # External CloudNativePG cluster.
          # ==========================================================

          psql:
            main:
              host: postgres-rw.databases.svc.cluster.local
              port: 5432
              username: gitlab
              database: gitlabhq_production

            password:
              useSecret: true
              secret: gitlab-postgres
              key: password

          # ==========================================================
          # Valkey
          #
          # External Valkey with ACL user "gitlab".
          # ==========================================================

          redis:
            host: valkey.valkey.svc.cluster.local
            port: 6379
            user: gitlab

            auth:
              enabled: true
              secret: gitlab-valkey-credentials
              key: password

          # ==========================================================
          # Gitaly
          # ==========================================================

          gitaly:
            enabled: true

          # ==========================================================
          # OBJECT STORAGE
          #
          # External MinIO.
          # ==========================================================

          appConfig:

            object_store:
              enabled: true
              proxy_download: true

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Git LFS
            # --------------------------------------------------------

            lfs:
              enabled: true
              proxy_download: true
              bucket: gitlab-lfs

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # CI/CD artifacts
            # --------------------------------------------------------

            artifacts:
              enabled: true
              proxy_download: true
              bucket: gitlab-artifacts

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # User uploads
            # --------------------------------------------------------

            uploads:
              enabled: true
              proxy_download: true
              bucket: gitlab-uploads

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Packages
            # --------------------------------------------------------

            packages:
              enabled: true
              proxy_download: true
              bucket: gitlab-packages

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Disabled optional storage features
            # --------------------------------------------------------

            externalDiffs:
              enabled: false

            terraformState:
              enabled: false

            ciSecureFiles:
              enabled: false

            agentPlanContent:
              enabled: false

            dependencyProxy:
              enabled: false

            # --------------------------------------------------------
            # Backups
            # --------------------------------------------------------

            backups:
              bucket: gitlab-backups
              tmpBucket: gitlab-tmp

        # ============================================================
        # CERT-MANAGER
        #
        # Cluster already has cert-manager.
        # GitLab must not install it.
        # ============================================================

        installCertmanager: false

        # The GitLab chart also contains the certmanager-issuer
        # subchart. Disable it because certificates are handled by
        # our cluster-level cert-manager.
        certmanager-issuer:
          enabled: false

        # ============================================================
        # BUNDLED POSTGRESQL
        # ============================================================

        postgresql:
          install: false

        # ============================================================
        # BUNDLED REDIS / VALKEY
        # ============================================================

        redis:
          install: false

        # ============================================================
        # BUNDLED MINIO
        # ============================================================

        minio:
          enabled: false

        # ============================================================
        # BUNDLED NGINX
        # ============================================================

        nginx-ingress:
          enabled: false

        # ============================================================
        # BUNDLED PROMETHEUS
        # ============================================================

        prometheus:
          install: false

        # ============================================================
        # GITLAB RUNNER
        #
        # Enable the GitLab Runner subchart.
        #
        # We are using Kubernetes executors and will configure the
        # runner through GitLab's generated runner secret.
        # ============================================================

        gitlab-runner:
          install: true

          rbac:
            create: true

          runners:
            locked: false

            # The parent GitLab chart creates/configures the actual
            # runner secret. This value only allows the subchart to
            # render its configuration.
            secret: "nonempty"

            config: |
              [[runners]]
                name = "gitlab-kubernetes-runner"
                executor = "kubernetes"

                [runners.kubernetes]
                  namespace = "gitlab"
                  image = "ubuntu:22.04"

                  privileged = false
                  poll_timeout = 600

                  cpu_request = "100m"
                  memory_request = "256Mi"

                  cpu_limit = "2"
                  memory_limit = "2Gi"

                  service_cpu_request = "100m"
                  service_memory_request = "128Mi"

                  service_cpu_limit = "1"
                  service_memory_limit = "1Gi"

          podAnnotations:
            gitlab.com/prometheus_scrape: "true"
            gitlab.com/prometheus_port: "9252"

          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault

        # ============================================================
        # CONTAINER REGISTRY
        # ============================================================

        registry:
          enabled: true
          host: registry.harish8.com

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
