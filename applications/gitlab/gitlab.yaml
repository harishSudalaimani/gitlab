apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitlab
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: homelab

  source:
    repoURL: ssh://git@gitlab.com/harishSudalaimani/gitlab.git
    targetRevision: main
    # Vendored GitLab chart 10.2.4 with a small Gitaly StatefulSet patch.
    path: vendor/gitlab

    helm:
      # Gateway API CRDs are managed separately in-cluster.
      # Prevent Argo CD from applying bundled chart CRDs.
      skipCrds: true
      values: |
        # ============================================================
        # GLOBAL
        # ============================================================

        global:
          edition: ce

          hosts:
            domain: harish8.com
            hostSuffix: ""
            https: true

            gitlab:
              name: git.harish8.com

            registry:
              name: registry.harish8.com

          registry:
            bucket: gitlab-registry

          # ==========================================================
          # Gateway API
          #
          # Cilium + Gateway API are already running in the cluster.
          # GitLab routing is managed by a separate HTTPRoute manifest
          # in this repository.
          # ==========================================================

          gatewayApi:
            enabled: false
            configureCertmanager: false
            installEnvoy: false

          # ==========================================================
          # Ingress
          #
          # We will expose GitLab through our existing Cilium
          # Gateway API infrastructure.
          # ==========================================================

          ingress:
            enabled: false
            configureCertmanager: false

          # ==========================================================
          # KAS
          # ==========================================================

          kas:
            enabled: false

          # ==========================================================
          # PostgreSQL
          #
          # External CloudNativePG cluster.
          # ==========================================================

          psql:
            main:
              host: postgres-rw.databases.svc.cluster.local
              port: 5432
              username: gitlab
              database: gitlabhq_production

            password:
              useSecret: true
              secret: gitlab-postgres
              key: password

          # ==========================================================
          # Valkey
          #
          # External Valkey with ACL user "gitlab".
          # ==========================================================

          redis:
            host: valkey.valkey.svc.cluster.local
            port: 6379
            user: gitlab

            auth:
              enabled: true
              secret: gitlab-valkey-credentials
              key: password

          # ==========================================================
          # Gitaly
          # ==========================================================

          gitaly:
            enabled: true

          # ==========================================================
          # OBJECT STORAGE
          #
          # External MinIO.
          # ==========================================================

          appConfig:

            object_store:
              enabled: true
              proxy_download: true

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Git LFS
            # --------------------------------------------------------

            lfs:
              enabled: true
              proxy_download: true
              bucket: gitlab-lfs

            # --------------------------------------------------------
            # CI/CD artifacts
            # --------------------------------------------------------

            artifacts:
              enabled: true
              proxy_download: true
              bucket: gitlab-artifacts

            # --------------------------------------------------------
            # User uploads
            # --------------------------------------------------------

            uploads:
              enabled: true
              proxy_download: true
              bucket: gitlab-uploads

            # --------------------------------------------------------
            # Packages
            # --------------------------------------------------------

            packages:
              enabled: true
              proxy_download: true
              bucket: gitlab-packages

            # --------------------------------------------------------
            # Disabled optional storage features
            # --------------------------------------------------------

            externalDiffs:
              enabled: false

            terraformState:
              enabled: false

            ciSecureFiles:
              enabled: false

            agentPlanContent:
              enabled: false

            dependencyProxy:
              enabled: false

            # --------------------------------------------------------
            # Backups
            # --------------------------------------------------------

            backups:
              bucket: gitlab-backups
              tmpBucket: gitlab-tmp

        # ============================================================
        # CERT-MANAGER
        #
        # Cluster already has cert-manager.
        # GitLab must not install it.
        # ============================================================

        installCertmanager: false

        # The GitLab chart also contains the certmanager-issuer
        # subchart. Disable it because certificates are handled by
        # our cluster-level cert-manager.
        certmanager-issuer:
          enabled: false

        # ============================================================
        # BUNDLED POSTGRESQL
        # ============================================================

        postgresql:
          install: false

        # ============================================================
        # BUNDLED REDIS / VALKEY
        # ============================================================

        redis:
          install: false

        # ============================================================
        # BUNDLED MINIO
        # ============================================================

        minio:
          enabled: false

        # ============================================================
        # BUNDLED NGINX
        # ============================================================

        nginx-ingress:
          enabled: false

        # ============================================================
        # BUNDLED PROMETHEUS
        # ============================================================

        prometheus:
          install: false

        # ============================================================
        # UPGRADE CHECK
        #
        # Argo CD treats Helm pre-upgrade hooks as PreSync hooks, so
        # GitLab's upgrade-check job can run even on a brand-new sync.
        # Disable it for initial bootstrap.
        # ============================================================

        upgradeCheck:
          enabled: false

        # ============================================================
        # SINGLE-NODE BOOTSTRAP TUNING
        #
        # This homelab currently has a single worker node, so pin the
        # autoscaled components to one replica to reduce scheduling
        # pressure during the initial install.
        # ============================================================

        gitlab:
          webservice:
            minReplicas: 1
            maxReplicas: 1
            workerProcesses: 1
            deployment:
              readinessProbe:
                timeoutSeconds: 5
                failureThreshold: 6
              livenessProbe:
                timeoutSeconds: 60
                failureThreshold: 5
            resources:
              requests:
                cpu: 300m
                memory: 3Gi
              limits:
                cpu: "1"
                memory: 4Gi

          sidekiq:
            minReplicas: 1
            maxReplicas: 1
            resources:
              requests:
                cpu: 500m
                memory: 1500Mi
              limits:
                cpu: "1"
                memory: 2500Mi

          gitlab-shell:
            minReplicas: 1
            maxReplicas: 1
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi

          gitaly:
            gomemlimit:
              enabled: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: "1"
                memory: 2Gi

          toolbox:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            backups:
              objectStorage:
                backend: s3
                config:
                  secret: gitlab-backup-storage
                  key: config

        # ============================================================
        # GITLAB RUNNER
        #
        # The runner was disabled for the initial bootstrap to reduce
        # moving parts on a single-node cluster. Enable it now that
        # the core GitLab components are healthy.
        # ============================================================

        gitlab-runner:
          install: true
          concurrent: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          rbac:
            create: true

          runners:
            locked: false

            # The parent GitLab chart creates/configures the actual
            # runner secret. This value only allows the subchart to
            # render its configuration.
            secret: "nonempty"

            config: |
              [[runners]]
                name = "gitlab-kubernetes-runner"
                executor = "kubernetes"

                [runners.kubernetes]
                  namespace = "gitlab"
                  image = "ubuntu:22.04"

                  privileged = false
                  poll_timeout = 600

                  cpu_request = "250m"
                  memory_request = "512Mi"

                  cpu_limit = "2"
                  memory_limit = "3Gi"

                  service_cpu_request = "100m"
                  service_memory_request = "256Mi"

                  service_cpu_limit = "1"
                  service_memory_limit = "1500Mi"

          podAnnotations:
            gitlab.com/prometheus_scrape: "true"
            gitlab.com/prometheus_port: "9252"

          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault

        # ============================================================
        # CONTAINER REGISTRY
        # ============================================================

        registry:
          enabled: true
          host: registry.harish8.com
          hpa:
            minReplicas: 1
            maxReplicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          storage:
            secret: gitlab-registry-storage
            key: config

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
