apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitlab
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: homelab

  source:
    repoURL: https://charts.gitlab.io/
    chart: gitlab
    targetRevision: 10.2.4

    helm:
      values: |
        # ============================================================
        # GitLab global configuration
        # ============================================================

        global:
          edition: ce

          hosts:
            domain: harish8.com
            hostSuffix: ""
            https: true

            gitlab:
              name: git.harish8.com

            registry:
              name: registry.harish8.com

          # ----------------------------------------------------------
          # We already use Cilium + Gateway API.
          # Do not install/configure GitLab's Envoy Gateway.
          # ----------------------------------------------------------

          gatewayApi:
            enabled: false

          # ----------------------------------------------------------
          # We are NOT using GitLab's bundled NGINX ingress.
          # ----------------------------------------------------------

          ingress:
            enabled: false
            configureCertmanager: false

          # ----------------------------------------------------------
          # External cert-manager
          #
          # GitLab chart 10.2.4 uses the TOP-LEVEL
          # installCertmanager value.
          # ----------------------------------------------------------

          kas:
            enabled: false

          # ==========================================================
          # External PostgreSQL - CloudNativePG
          # ==========================================================

          psql:
            main:
              host: postgres-rw.databases.svc.cluster.local
              port: 5432
              username: gitlab
              database: gitlabhq_production

            password:
              useSecret: true
              secret: gitlab-postgres
              key: password

          # ==========================================================
          # External Valkey
          # ==========================================================

          redis:
            host: valkey.valkey.svc.cluster.local
            port: 6379

            user: gitlab

            auth:
              enabled: true
              secret: gitlab-valkey-credentials
              key: password

          # ==========================================================
          # GitLab Gitaly
          # ==========================================================

          gitaly:
            enabled: true

          # ==========================================================
          # External MinIO object storage
          # ==========================================================

          appConfig:

            object_store:
              enabled: true
              proxy_download: true

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Git LFS
            # --------------------------------------------------------

            lfs:
              enabled: true
              proxy_download: true

              bucket: gitlab-lfs

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # CI/CD artifacts
            # --------------------------------------------------------

            artifacts:
              enabled: true
              proxy_download: true

              bucket: gitlab-artifacts

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # User uploads
            # --------------------------------------------------------

            uploads:
              enabled: true
              proxy_download: true

              bucket: gitlab-uploads

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # GitLab Packages
            # --------------------------------------------------------

            packages:
              enabled: true
              proxy_download: true

              bucket: gitlab-packages

              connection:
                secret: gitlab-rails-storage
                key: connection

            # --------------------------------------------------------
            # Optional object storage features
            # --------------------------------------------------------

            externalDiffs:
              enabled: false

            terraformState:
              enabled: false

            ciSecureFiles:
              enabled: false

            agentPlanContent:
              enabled: false

            dependencyProxy:
              enabled: false

            # --------------------------------------------------------
            # GitLab backups
            # --------------------------------------------------------

            backups:
              bucket: gitlab-backups
              tmpBucket: gitlab-tmp

        # ============================================================
        # IMPORTANT:
        #
        # GitLab chart 10.2.4 does NOT accept:
        #
        # certmanager:
        #   install: false
        #
        # Use this top-level value instead.
        # ============================================================

        installCertmanager: false

        # ============================================================
        # Disable bundled PostgreSQL
        # ============================================================

        postgresql:
          install: false

        # ============================================================
        # Disable bundled Redis/Valkey
        # ============================================================

        redis:
          install: false

        # ============================================================
        # Disable bundled MinIO
        # ============================================================

        minio:
          enabled: false

        # ============================================================
        # Disable bundled NGINX
        # ============================================================

        nginx-ingress:
          enabled: false

        # ============================================================
        # Disable bundled Prometheus
        # ============================================================

        prometheus:
          install: false

        # ============================================================
        # Runner will be deployed separately
        # ============================================================

        gitlab-runner:
          install: false

        # ============================================================
        # GitLab Container Registry
        # ============================================================

        registry:
          enabled: true
          host: registry.harish8.com

        # ============================================================
        # GitLab subcharts
        # ============================================================

        gitlab:
          gitaly:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true