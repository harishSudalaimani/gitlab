apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway
  hostnames:
    - grafana.harish8.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80