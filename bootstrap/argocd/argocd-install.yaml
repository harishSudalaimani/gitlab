apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.3.4
    helm:
      values: |
        crds:
          install: true
          keep: true

        global:
          domain: argocd.harish8.com

        server:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          service:
            type: ClusterIP
          ingress:
            enabled: false
          extraArgs:
            - --insecure

        controller:
          replicas: 1

        repoServer:
          replicas: 1

        applicationSet:
          replicas: 1

        redis:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
