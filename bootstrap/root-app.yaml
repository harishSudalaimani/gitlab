apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: homelab

  source:
    repoURL: ssh://git@gitlab.com/harishSudalaimani/gitlab.git
    targetRevision: main
    path: applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true