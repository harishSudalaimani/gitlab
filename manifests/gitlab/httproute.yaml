apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-web
  namespace: gitlab
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway
      kind: Gateway
  hostnames:
    - git.harish8.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-webservice-default
          port: 8181
